[versions]
junitBom = "5.9.1"
lwjgl = "3.4.3"

[libraries]
lwjgl-core = { group = "org.lwjgl", name = "lwjgl", version.ref = "lwjgl" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitBom" }
