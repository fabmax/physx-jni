junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
webidl = { id = "de.fabmax.webidl-util", version = "0.11.0" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
